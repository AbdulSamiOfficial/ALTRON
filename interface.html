<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALTRON — Personal AI Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   MAIN APP
========================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* =========================
   HUD
========================= */

.hud {
    position: relative;
    width: 280px;
    height: 280px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Outer segmented ring */

.outer {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;

    background: conic-gradient(
        from -2.5deg,
        #fff 0 40deg,
        transparent 40deg 45deg,

        #fff 45deg 85deg,
        transparent 85deg 90deg,

        #fff 90deg 130deg,
        transparent 130deg 135deg,

        #fff 135deg 175deg,
        transparent 175deg 180deg,

        #fff 180deg 220deg,
        transparent 220deg 225deg,

        #fff 225deg 265deg,
        transparent 265deg 270deg,

        #fff 270deg 310deg,
        transparent 310deg 315deg,

        #fff 315deg 355deg,
        transparent 355deg 360deg
    );

    -webkit-mask: radial-gradient(
        transparent 89px,
        #000 90px
    );

    mask: radial-gradient(
        transparent 89px,
        #000 90px
    );

    animation: rotate-cw 20s linear infinite;
}

/* Middle tick ring */

.tick-ring {
    position: absolute;
    width: 156px;
    height: 156px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;
}

/* Tick marks */

.ticks {
    position: absolute;
    width: 156px;
    height: 156px;

    border-radius: 50%;

    background: repeating-conic-gradient(
        from 0deg,
        #fff 0deg 2deg,
        transparent 2deg 5deg
    );

    -webkit-mask: radial-gradient(
        transparent 57px,
        #000 58px
    );

    mask: radial-gradient(
        transparent 57px,
        #000 58px
    );

    animation: rotate-ccw 15s linear infinite;
}

/* Outer tick border */

.tick-border-outer {
    position: absolute;

    width: 156px;
    height: 156px;

    border: 2px solid #fff;
    border-radius: 50%;
}

/* Inner tick border */

.tick-border-inner {
    position: absolute;

    width: 116px;
    height: 116px;

    border: 2px solid #fff;
    border-radius: 50%;
}

/* Center */

.center {
    position: absolute;

    width: 100px;
    height: 100px;

    background: #fff;

    border-radius: 50%;

    animation: pulse 3s ease-in-out infinite;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

/* =========================
   ALTRON ACTIVE STATE
========================= */

.hud.active .center {
    animation:
        pulse-fast 0.7s ease-in-out infinite alternate;

    box-shadow:
        0 0 15px #fff,
        0 0 35px rgba(255,255,255,0.7),
        0 0 70px rgba(255,255,255,0.35);
}

.hud.active .outer {
    animation-duration: 5s;
}

.hud.active .ticks {
    animation-duration: 4s;
}

/* =========================
   ALTRON NAME
========================= */

.logo {
    margin-top: 25px;

    font-size: 22px;
    font-weight: bold;

    letter-spacing: 8px;

    text-align: center;
}

.status {
    margin-top: 8px;

    font-size: 11px;

    letter-spacing: 3px;

    opacity: 0.65;

    text-transform: uppercase;

    min-height: 15px;
}

/* =========================
   INPUT AREA
========================= */

.input-area {
    position: absolute;

    bottom: 35px;

    width: min(600px, 90%);

    display: flex;

    gap: 8px;
}

#userInput {
    flex: 1;

    height: 46px;

    background: #080808;

    border: 1px solid #444;

    color: #fff;

    outline: none;

    padding: 0 16px;

    font-size: 14px;

    border-radius: 4px;

    transition: border 0.2s ease;
}

#userInput:focus {
    border-color: #fff;
}

#userInput::placeholder {
    color: #777;
}

#sendBtn {
    width: 90px;

    border: 1px solid #fff;

    background: #fff;

    color: #000;

    font-weight: bold;

    cursor: pointer;

    border-radius: 4px;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}

#sendBtn:hover {
    background: #000;
    color: #fff;
}

/* =========================
   RESPONSE
========================= */

.response {
    position: absolute;

    top: 30px;

    width: min(700px, 90%);

    text-align: center;

    font-size: 14px;

    color: #ddd;

    min-height: 20px;

    opacity: 0.9;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes rotate-cw {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate-ccw {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(-360deg);
    }
}

@keyframes pulse {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

@keyframes pulse-fast {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.15);
    }
}

/* Mobile */

@media (max-width: 600px) {

    .hud {
        transform: scale(0.8);
    }

    .logo {
        margin-top: 5px;
    }

    .input-area {
        bottom: 20px;
    }

    #sendBtn {
        width: 70px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- Response -->
    <div id="response" class="response"></div>

    <!-- HUD -->
    <div id="hud" class="hud">

        <div class="outer"></div>

        <div class="tick-ring">

            <div class="ticks"></div>

            <div class="tick-border-outer"></div>

            <div class="tick-border-inner"></div>

        </div>

        <div class="center"></div>

    </div>

    <!-- Name -->
    <div class="logo">
        ALTRON
    </div>

    <!-- Status -->
    <div id="status" class="status">
        SYSTEM READY
    </div>

    <!-- Input -->
    <div class="input-area">

        <input
            id="userInput"
            type="text"
            placeholder="Talk to ALTRON..."
            autocomplete="off"
        >

        <button id="sendBtn">
            SEND
        </button>

    </div>

</div>

<script>

/* =========================
   ELEMENTS
========================= */

const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const response = document.getElementById("response");
const statusText = document.getElementById("status");
const hud = document.getElementById("hud");


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {

    const message = input.value.trim();

    if (!message) {
        return;
    }

    input.value = "";

    response.textContent = "You: " + message;

    processCommand(message);
}


/* =========================
   ALTRON BRAIN
========================= */

function processCommand(message) {

    const command = message.toLowerCase();

    let reply = "";

    /* Greetings */

    if (
        command.includes("hello") ||
        command.includes("hi") ||
        command.includes("hey")
    ) {

        reply = "Hello. I am ALTRON. How can I assist you?";

    }

    /* Name */

    else if (
        command.includes("your name") ||
        command.includes("who are you")
    ) {

        reply = "I am ALTRON, your personal AI assistant.";

    }

    /* Time */

    else if (command.includes("time")) {

        const now = new Date();

        reply =
            "The current time is " +
            now.toLocaleTimeString();

    }

    /* Date */

    else if (
        command.includes("date") ||
        command.includes("today")
    ) {

        const now = new Date();

        reply =
            "Today is " +
            now.toLocaleDateString(
                undefined,
                {
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );

    }

    /* Open Google */

    else if (command.includes("open google")) {

        reply = "Opening Google.";

        window.open(
            "https://www.google.com",
            "_blank"
        );

    }

    /* Open YouTube */

    else if (command.includes("open youtube")) {

        reply = "Opening YouTube.";

        window.open(
            "https://www.youtube.com",
            "_blank"
        );

    }

    /* Clear */

    else if (command.includes("clear")) {

        response.textContent = "";

        reply = "Screen cleared.";

    }

    /* Default */

    else {

        reply =
            "I received your message: " +
            message +
            ". My AI brain is not connected yet.";

    }

    speak(reply);
}


/* =========================
   TEXT TO SPEECH
========================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {

        statusText.textContent =
            "VOICE NOT SUPPORTED";

        return;
    }

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.rate = 1;
    speech.pitch = 1;
    speech.volume = 1;

    statusText.textContent =
        "ALTRON SPEAKING";

    hud.classList.add("active");

    speech.onend = function() {

        hud.classList.remove("active");

        statusText.textContent =
            "SYSTEM READY";
    };

    speech.onerror = function() {

        hud.classList.remove("active");

        statusText.textContent =
            "VOICE ERROR";
    };

    speechSynthesis.speak(speech);
}


/* =========================
   BUTTON
========================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================
   ENTER KEY
========================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


/* =========================
   START
========================= */

window.addEventListener(
    "load",
    function() {

        input.focus();

    }
);

</script>

</body>
</html>
