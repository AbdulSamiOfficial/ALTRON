<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALTRON · Personal AI Assistant</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    position: relative;
}

/* ==============================
   THREE.JS CANVAS
================================ */

canvas {
    display: block;
}

/* ==============================
   TOP BRAND
================================ */

.brand {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);

    color: rgba(255,255,255,0.9);

    font-size: 16px;
    font-weight: bold;

    letter-spacing: 8px;

    z-index: 20;

    pointer-events: none;

    text-shadow:
        0 0 8px rgba(255,255,255,0.35);
}

/* ==============================
   STATUS
================================ */

.status {

    position: fixed;

    top: 55px;

    left: 50%;

    transform: translateX(-50%);

    color: rgba(255,255,255,0.55);

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    z-index: 20;

    pointer-events: none;
}

/* ==============================
   RESPONSE
================================ */

.response {

    position: fixed;

    top: 82px;

    left: 50%;

    transform: translateX(-50%);

    width: min(700px, 90%);

    text-align: center;

    color: rgba(255,255,255,0.8);

    font-size: 14px;

    line-height: 1.5;

    z-index: 20;

    pointer-events: none;

    min-height: 22px;
}

/* ==============================
   INPUT AREA
================================ */

.input-area {

    position: fixed;

    bottom: 35px;

    left: 50%;

    transform: translateX(-50%);

    width: min(650px, 90%);

    display: flex;

    gap: 8px;

    z-index: 30;
}

#userInput {

    flex: 1;

    height: 48px;

    padding: 0 17px;

    background: rgba(0,0,0,0.85);

    border: 1px solid rgba(255,255,255,0.35);

    border-radius: 5px;

    outline: none;

    color: #fff;

    font-size: 14px;

    letter-spacing: 0.3px;

    backdrop-filter: blur(10px);

    transition: border 0.2s ease,
                box-shadow 0.2s ease;
}

#userInput:focus {

    border-color: #fff;

    box-shadow:
        0 0 15px rgba(255,255,255,0.12);
}

#userInput::placeholder {

    color: rgba(255,255,255,0.35);
}

#sendBtn {

    width: 90px;

    border: 1px solid #fff;

    border-radius: 5px;

    background: #fff;

    color: #000;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}

#sendBtn:hover {

    background: #000;

    color: #fff;
}

/* ==============================
   VOICE BUTTON
================================ */

#voiceBtn {

    width: 48px;

    border: 1px solid rgba(255,255,255,0.6);

    border-radius: 5px;

    background: rgba(0,0,0,0.8);

    color: #fff;

    font-size: 17px;

    cursor: pointer;

    transition: 0.2s ease;
}

#voiceBtn:hover {

    background: #fff;

    color: #000;
}

#voiceBtn.listening {

    background: #fff;

    color: #000;

    box-shadow:
        0 0 20px rgba(255,255,255,0.45);
}

/* ==============================
   BOTTOM INFO
================================ */

.info {

    position: fixed;

    bottom: 12px;

    right: 18px;

    color: rgba(255,255,255,0.35);

    font-size: 9px;

    letter-spacing: 2px;

    z-index: 20;

    pointer-events: none;
}

/* ==============================
   MOBILE
================================ */

@media (max-width: 600px) {

    .brand {

        font-size: 14px;

        letter-spacing: 6px;
    }

    .response {

        font-size: 12px;

        top: 80px;
    }

    .input-area {

        bottom: 22px;

        width: 94%;
    }

    #sendBtn {

        width: 70px;
    }

}

</style>
</head>

<body>

<!-- ==============================
     UI
================================ -->

<div class="brand">
    ALTRON
</div>

<div id="status" class="status">
    SYSTEM READY
</div>

<div id="response" class="response"></div>

<div class="input-area">

    <input
        id="userInput"
        type="text"
        placeholder="Talk to ALTRON..."
        autocomplete="off"
    >

    <button id="voiceBtn" title="Voice Input">
        MIC
    </button>

    <button id="sendBtn">
        SEND
    </button>

</div>

<div class="info">
    PERSONAL AI ASSISTANT
</div>


<!-- ==============================
     THREE.JS IMPORT
================================ -->

<script type="importmap">
{
    "imports": {
        "three":
        "https://unpkg.com/three@0.126.0/build/three.module.js",

        "three/addons/":
        "https://unpkg.com/three@0.126.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from 'three';

import {
    OrbitControls
}
from 'three/addons/controls/OrbitControls.js';


/* =========================================
   UI ELEMENTS
========================================= */

const input =
    document.getElementById("userInput");

const sendBtn =
    document.getElementById("sendBtn");

const voiceBtn =
    document.getElementById("voiceBtn");

const statusText =
    document.getElementById("status");

const responseText =
    document.getElementById("response");


/* =========================================
   ALTRON STATE
========================================= */

let isSpeaking = false;

let isListening = false;


/* =========================================
   THREE.JS SCENE
========================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* =========================================
   CAMERA
========================================= */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

camera.position.set(
    0,
    0,
    12
);

camera.lookAt(
    0,
    0,
    0
);


/* =========================================
   RENDERER
========================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    2.2;

document.body.appendChild(
    renderer.domElement
);


/* =========================================
   CONTROLS
========================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping =
    true;

controls.dampingFactor =
    0.05;

controls.autoRotate =
    true;

controls.autoRotateSpeed =
    0.8;

controls.enableZoom =
    true;

controls.enablePan =
    false;

controls.rotateSpeed =
    0.5;

controls.target.set(
    0,
    0,
    0
);

controls.update();


/* =========================================
   LIGHTING
========================================= */

const ambientLight =
    new THREE.AmbientLight(
        0xa0a0d0,
        1.6
    );

scene.add(
    ambientLight
);

const dirLight =
    new THREE.DirectionalLight(
        0xffffff,
        0.8
    );

dirLight.position.set(
    1,
    1,
    1
);

scene.add(
    dirLight
);


/* =========================================
   STAR TEXTURE
========================================= */

const canvas =
    document.createElement(
        "canvas"
    );

canvas.width = 32;
canvas.height = 32;

const ctx =
    canvas.getContext("2d");

const gradient =
    ctx.createRadialGradient(
        16,
        16,
        0,
        16,
        16,
        16
    );

gradient.addColorStop(
    0,
    "rgba(255,255,255,1)"
);

gradient.addColorStop(
    0.5,
    "rgba(255,255,255,0.95)"
);

gradient.addColorStop(
    1,
    "rgba(255,255,255,0)"
);

ctx.fillStyle =
    gradient;

ctx.fillRect(
    0,
    0,
    32,
    32
);

const texture =
    new THREE.CanvasTexture(
        canvas
    );


/* =========================================
   MAIN STAR SPHERE
========================================= */

const sphereStarCount =
    6000;

const sphereGeo =
    new THREE.BufferGeometry();

const spherePositions =
    new Float32Array(
        sphereStarCount * 3
    );

const sphereSizes =
    new Float32Array(
        sphereStarCount
    );

const sphereColors =
    new Float32Array(
        sphereStarCount * 3
    );

const sphereRadius =
    6.0;


for (
    let i = 0;
    i < sphereStarCount;
    i++
) {

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            Math.random() * 2 - 1
        );

    const r =
        sphereRadius +
        (Math.random() - 0.5) *
        0.4;


    const x =
        Math.sin(phi) *
        Math.cos(theta) *
        r;

    const y =
        Math.sin(phi) *
        Math.sin(theta) *
        r;

    const z =
        Math.cos(phi) *
        r;


    spherePositions[
        i * 3
    ] = x;

    spherePositions[
        i * 3 + 1
    ] = y;

    spherePositions[
        i * 3 + 2
    ] = z;


    sphereSizes[i] =
        Math.random() *
        0.08 +
        0.02;


    const brightness =
        1.3 +
        Math.random() *
        0.7;

    const tint =
        Math.random() *
        0.15;


    sphereColors[
        i * 3
    ] =
        brightness;

    sphereColors[
        i * 3 + 1
    ] =
        brightness *
        (0.95 + tint);

    sphereColors[
        i * 3 + 2
    ] =
        brightness *
        (0.9 + tint);
}


sphereGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        spherePositions,
        3
    )
);

sphereGeo.setAttribute(
    "size",
    new THREE.BufferAttribute(
        sphereSizes,
        1
    )
);

sphereGeo.setAttribute(
    "color",
    new THREE.BufferAttribute(
        sphereColors,
        3
    )
);


const sphereMat =
    new THREE.PointsMaterial({

        size: 0.08,

        map: texture,

        transparent: true,

        opacity: 1.0,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false,

        vertexColors: true,

        sizeAttenuation: true

    });


const sphereStars =
    new THREE.Points(
        sphereGeo,
        sphereMat
    );

scene.add(
    sphereStars
);


/* =========================================
   SPARKLES
========================================= */

const sparkleCount =
    800;

const sparkleGeo =
    new THREE.BufferGeometry();

const sparklePositions =
    new Float32Array(
        sparkleCount * 3
    );

const sparkleColors =
    new Float32Array(
        sparkleCount * 3
    );


for (
    let i = 0;
    i < sparkleCount;
    i++
) {

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            Math.random() * 2 - 1
        );

    const r =
        sphereRadius +
        (Math.random() - 0.5) *
        0.6;


    const x =
        Math.sin(phi) *
        Math.cos(theta) *
        r;

    const y =
        Math.sin(phi) *
        Math.sin(theta) *
        r;

    const z =
        Math.cos(phi) *
        r;


    sparklePositions[
        i * 3
    ] = x;

    sparklePositions[
        i * 3 + 1
    ] = y;

    sparklePositions[
        i * 3 + 2
    ] = z;


    sparkleColors[
        i * 3
    ] = 1.5;

    sparkleColors[
        i * 3 + 1
    ] = 1.5;

    sparkleColors[
        i * 3 + 2
    ] =
        1.5 +
        Math.random() *
        0.5;
}


sparkleGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        sparklePositions,
        3
    )
);

sparkleGeo.setAttribute(
    "color",
    new THREE.BufferAttribute(
        sparkleColors,
        3
    )
);


const sparkleMat =
    new THREE.PointsMaterial({

        size: 0.12,

        map: texture,

        transparent: true,

        opacity: 1.0,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false,

        vertexColors: true,

        sizeAttenuation: true

    });


const sparkles =
    new THREE.Points(
        sparkleGeo,
        sparkleMat
    );

scene.add(
    sparkles
);


/* =========================================
   ALTRON CENTER CORE
========================================= */

const coreCanvas =
    document.createElement(
        "canvas"
    );

coreCanvas.width = 1024;
coreCanvas.height = 512;

const coreCtx =
    coreCanvas.getContext(
        "2d"
    );


function createAltronCore() {

    coreCtx.clearRect(
        0,
        0,
        1024,
        512
    );


    coreCtx.textAlign =
        "center";

    coreCtx.textBaseline =
        "middle";

    coreCtx.font =
        "bold 190px Arial";


    coreCtx.shadowColor =
        "#ffffff";

    coreCtx.shadowBlur =
        55;

    coreCtx.fillStyle =
        "rgba(255,255,255,0.8)";

    coreCtx.fillText(
        "ALTRON",
        512,
        256
    );


    coreCtx.shadowBlur =
        25;

    coreCtx.fillStyle =
        "#ffffff";

    coreCtx.fillText(
        "ALTRON",
        512,
        256
    );
}


createAltronCore();


const altronTexture =
    new THREE.CanvasTexture(
        coreCanvas
    );

altronTexture.encoding =
    THREE.sRGBEncoding;

altronTexture.minFilter =
    THREE.LinearFilter;

altronTexture.magFilter =
    THREE.LinearFilter;


const textMaterial =
    new THREE.MeshBasicMaterial({

        map:
            altronTexture,

        transparent: true,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false,

        depthTest: true,

        side:
            THREE.DoubleSide

    });


const textPlane =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            4.5,
            2.25
        ),

        textMaterial

    );


scene.add(
    textPlane
);


/* =========================================
   SPEAKING VISUAL
========================================= */

function setSpeakingState(
    active
) {

    isSpeaking =
        active;

    if (active) {

        statusText.textContent =
            "ALTRON SPEAKING";

    } else {

        statusText.textContent =
            "SYSTEM READY";
    }
}


/* =========================================
   ALTRON VOICE
========================================= */

function speak(
    text
) {

    if (
        !("speechSynthesis"
        in window)
    ) {

        statusText.textContent =
            "VOICE NOT SUPPORTED";

        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    setSpeakingState(
        true
    );


    utterance.onend =
        function() {

            setSpeakingState(
                false
            );

        };


    utterance.onerror =
        function() {

            setSpeakingState(
                false
            );

        };


    speechSynthesis.speak(
        utterance
    );
}


/* =========================================
   ALTRON BRAIN
========================================= */

function processCommand(
    message
) {

    const command =
        message
        .toLowerCase()
        .trim();


    let reply;


    /* Greeting */

    if (
        command.includes("hello") ||
        command.includes("hi") ||
        command.includes("hey")
    ) {

        reply =
            "Hello. I am ALTRON. How can I assist you?";

    }


    /* Identity */

    else if (
        command.includes(
            "who are you"
        ) ||
        command.includes(
            "your name"
        )
    ) {

        reply =
            "I am ALTRON, your personal AI assistant.";

    }


    /* Time */

    else if (
        command.includes(
            "time"
        )
    ) {

        reply =
            "The current time is " +
            new Date()
            .toLocaleTimeString();

    }


    /* Date */

    else if (
        command.includes(
            "date"
        ) ||
        command.includes(
            "today"
        )
    ) {

        reply =
            "Today is " +
            new Date()
            .toLocaleDateString(
                undefined,
                {
                    weekday:
                        "long",

                    year:
                        "numeric",

                    month:
                        "long",

                    day:
                        "numeric"
                }
            );

    }


    /* Open Google */

    else if (
        command.includes(
            "open google"
        )
    ) {

        reply =
            "Opening Google.";

        window.open(
            "https://www.google.com",
            "_blank"
        );

    }


    /* Open YouTube */

    else if (
        command.includes(
            "open youtube"
        )
    ) {

        reply =
            "Opening YouTube.";

        window.open(
            "https://www.youtube.com",
            "_blank"
        );

    }


    /* Stop */

    else if (
        command.includes(
            "stop"
        )
    ) {

        speechSynthesis.cancel();

        setSpeakingState(
            false
        );

        reply =
            "Voice output stopped.";

    }


    /* Default */

    else {

        reply =
            "I received your command: " +
            message +
            ". My full AI intelligence is not connected yet.";

    }


    responseText.textContent =
        reply;


    speak(
        reply
    );
}


/* =========================================
   SEND
========================================= */

function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    input.value = "";


    statusText.textContent =
        "PROCESSING";


    processCommand(
        message
    );
}


sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================================
   ENTER KEY
========================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            sendMessage();

        }

    }
);


/* =========================================
   MICROPHONE
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.lang =
        "en-US";


    recognition.onstart =
        function() {

            isListening =
                true;

            voiceBtn.classList.add(
                "listening"
            );

            statusText.textContent =
                "LISTENING";

        };


    recognition.onresult =
        function(event) {

            const transcript =
                event
                .results[0][0]
                .transcript;


            input.value =
                transcript;


            sendMessage();

        };


    recognition.onend =
        function() {

            isListening =
                false;

            voiceBtn.classList.remove(
                "listening"
            );

            if (!isSpeaking) {

                statusText.textContent =
                    "SYSTEM READY";

            }

        };


    recognition.onerror =
        function() {

            isListening =
                false;

            voiceBtn.classList.remove(
                "listening"
            );

            statusText.textContent =
                "VOICE INPUT ERROR";

        };

}


/* =========================================
   MICROPHONE BUTTON
========================================= */

voiceBtn.addEventListener(
    "click",
    function() {

        if (!recognition) {

            statusText.textContent =
                "VOICE INPUT NOT SUPPORTED";

            return;

        }


        if (isListening) {

            recognition.stop();

        } else {

            speechSynthesis.cancel();

            recognition.start();

        }

    }
);


/* =========================================
   ANIMATION
========================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        performance.now() *
        0.001;


    /* Normal rotation */

    sphereStars.rotation.y =
        time * 0.05;

    sphereStars.rotation.x =
        Math.sin(
            time * 0.1
        ) * 0.02;


    sparkles.rotation.y =
        time * 0.04;

    sparkles.rotation.x =
        Math.sin(
            time * 0.12
        ) * 0.02;


    /* Keep ALTRON facing camera */

    textPlane.quaternion.copy(
        camera.quaternion
    );


    /* Normal pulse */

    let pulse =
        1 +
        Math.sin(
            time * 3
        ) * 0.02;


    /* Stronger pulse while speaking */

    if (isSpeaking) {

        pulse =
            1 +
            Math.sin(
                time * 12
            ) * 0.08;


        textPlane.material.opacity =
            0.8 +
            Math.sin(
                time * 10
            ) * 0.2;

    } else {

        textPlane.material.opacity =
            1;

    }


    textPlane.scale.set(
        pulse,
        pulse,
        1
    );


    /* Faster sphere while speaking */

    if (isSpeaking) {

        sphereStars.rotation.y +=
            0.006;

        sparkles.rotation.y +=
            0.009;

    }


    controls.update();

    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================
   START
========================================= */

window.addEventListener(
    "load",
    function() {

        input.focus();

    }
);

</script>

</body>
</html>
