
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sci-Fi HUD Animation (Black & White)</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #000; /* Pure Black Background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Main Container */
    .hud {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Blue glow hata diya gaya hai */
    }

    /* Outer Segmented Ring */
    .outer {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      /* Creates 8 segments with 5-degree gaps */
      background: conic-gradient(
        from -2.5deg,
        #fff 0 40deg, transparent 40deg 45deg,
        #fff 45deg 85deg, transparent 85deg 90deg,
        #fff 90deg 130deg, transparent 130deg 135deg,
        #fff 135deg 175deg, transparent 175deg 180deg,
        #fff 180deg 220deg, transparent 220deg 225deg,
        #fff 225deg 265deg, transparent 265deg 270deg,
        #fff 270deg 310deg, transparent 310deg 315deg,
        #fff 315deg 355deg, transparent 355deg 360deg
      );
      /* Hollow out the center to create a ring */
      -webkit-mask: radial-gradient(transparent 89px, #000 90px);
      mask: radial-gradient(transparent 89px, #000 90px);
      animation: rotate-cw 20s linear infinite;
    }

    /* Tick Ring Container */
    .tick-ring {
      position: absolute;
      width: 156px;
      height: 156px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
    }

    /* Small Tick Marks */
    .ticks {
      position: absolute;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      /* Creates the small radial lines */
      background: repeating-conic-gradient(
        from 0deg,
        #fff 0deg 2deg,
        transparent 2deg 5deg
      );
      /* Mask to only show ticks between the inner and outer borders */
      -webkit-mask: radial-gradient(transparent 57px, #000 58px);
      mask: radial-gradient(transparent 57px, #000 58px);
      animation: rotate-ccw 15s linear infinite;
    }

    /* Outer Border for Ticks */
    .tick-border-outer {
      position: absolute;
      width: 156px;
      height: 156px;
      border: 2px solid #fff;
      border-radius: 50%;
    }

    /* Inner Border for Ticks */
    .tick-border-inner {
      position: absolute;
      width: 116px;
      height: 116px;
      border: 2px solid #fff;
      border-radius: 50%;
    }

    /* Center Circle */
    .center {
      position: absolute;
      width: 100px;
      height: 100px;
      background-color: #fff;
      border-radius: 50%;
      /* Blue shadow hata kar simple pulse animation rakhi hai */
      animation: pulse 3s ease-in-out infinite;
    }

    /* Animations */
    @keyframes rotate-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotate-ccw {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <div class="hud">
    <!-- Outer segmented ring -->
    <div class="outer"></div>
    
    <!-- Middle tick ring -->
    <div class="tick-ring">
      <div class="ticks"></div>
      <div class="tick-border-outer"></div>
      <div class="tick-border-inner"></div>
    </div>
    
    <!-- Center core -->
    <div class="center"></div>
  </div>
</body>
</html>
