<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Travel Game 🚀</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; font-family: Arial, sans-serif; color: white; }
        #hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,20,40,0.8); padding: 12px 20px;
            border-radius: 10px; border: 2px solid #00aaff;
            font-size: 16px; pointer-events: none; user-select: none;
            min-width: 180px;
        }
        #hud div { margin: 4px 0; }
        .label { color: #88ccff; font-size: 12px; text-transform: uppercase; }
        .value { color: #ffffff; font-size: 20px; font-weight: bold; }
        #controls {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,20,40,0.8); padding: 10px 24px;
            border-radius: 30px; border: 1px solid #00aaff;
            font-size: 14px; text-align: center; color: #aaddff;
            pointer-events: none;
        }
        #gameOver {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10,0,30,0.95);
            padding: 40px 60px; border-radius: 20px;
            border: 2px solid #ff4466; text-align: center;
            display: none; box-shadow: 0 0 40px #ff446688;
        }
        #gameOver h1 { color: #ff4466; margin: 0 0 10px; font-size: 40px; }
        #gameOver p { font-size: 20px; margin: 10px 0; }
        #gameOver button {
            margin-top: 20px; padding: 12px 32px;
            background: #00aaff; color: white; border: none;
            border-radius: 8px; font-size: 18px; cursor: pointer;
            transition: 0.2s;
        }
        #gameOver button:hover { background: #00ccff; transform: scale(1.05); }
        #startScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #050520, #000010);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10; text-align: center;
        }
        #startScreen h1 {
            font-size: 60px; color: #00aaff;
            text-shadow: 0 0 30px #00aaff;
            margin-bottom: 10px;
        }
        #startScreen p { font-size: 20px; color: #88ccff; margin: 8px 0; }
        #startScreen button {
            margin-top: 40px; padding: 16px 50px;
            background: linear-gradient(45deg, #0066ff, #00ccff);
            color: white; border: none; border-radius: 40px;
            font-size: 24px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 30px #00aaff;
            transition: 0.3s;
        }
        #startScreen button:hover { transform: scale(1.1); box-shadow: 0 0 50px #00ccff; }
        .key-hint {
            display: inline-block; padding: 4px 10px; margin: 0 4px;
            background: #003366; border-radius: 5px; border: 1px solid #00aaff;
            font-family: monospace; color: #aaddff;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="startScreen">
        <h1>🚀 SPACE TRAVEL</h1>
        <p>Asteroids se bacho aur zyada se zyada door jao!</p>
        <p style="margin-top: 30px; font-size: 16px;">CONTROLS</p>
        <p><span class="key-hint">←</span> <span class="key-hint">→</span> ya <span class="key-hint">A</span> <span class="key-hint">D</span> - Move Left/Right</p>
        <p><span class="key-hint">↑</span> <span class="key-hint">↓</span> ya <span class="key-hint">W</span> <span class="key-hint">S</span> - Move Up/Down</p>
        <p><span class="key-hint">SPACE</span> - Boost (Speed Badhao)</p>
        <button id="startBtn">START MISSION</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div><span class="label">Score</span><br><span class="value" id="score">0</span></div>
        <div style="margin-top:10px;"><span class="label">Speed</span><br><span class="value" id="speed">1.0x</span></div>
        <div style="margin-top:10px;"><span class="label">Shield</span><br><span class="value" id="shield" style="color:#44ff88;">🟢 100%</span></div>
    </div>

    <!-- Controls Hint -->
    <div id="controls">← → ↑ ↓ Move &nbsp;|&nbsp; SPACE Boost &nbsp;|&nbsp; Avoid Asteroids!</div>

    <!-- Game Over -->
    <div id="gameOver">
        <h1>💥 CRASHED!</h1>
        <p>Mission Failed</p>
        <p style="color:#ffcc00;">Final Score: <span id="finalScore">0</span></p>
        <button id="restartBtn">TRY AGAIN</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // =====================
        // SCENE SETUP
        // =====================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000011, 0.008);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10);
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // =====================
        // LIGHTS
        // =====================
        scene.add(new THREE.AmbientLight(0x404060, 1));
        
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5);
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0x4466cc, 0.6);
        fill.position.set(-10, 0, 5);
        scene.add(fill);

        // =====================
        // STARFIELD
        // =====================
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 600;
            starPos[i+1] = (Math.random() - 0.5) * 300;
            starPos[i+2] = -Math.random() * 600;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.9 });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // =====================
        // SPACECRAFT (detailed model)
        // =====================
        const spacecraft = new THREE.Group();

        const hullMat = new THREE.MeshStandardMaterial({ color: 0xb0c0d0, roughness: 0.4, metalness: 0.8 });
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.6, metalness: 0.9 });
        const accentMat = new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: 0.3, metalness: 0.7, emissive: 0x220000 });
        const windowMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x004466, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.9 });
        const glowMat = new THREE.MeshStandardMaterial({ color: 0x2266ff, emissive: 0x0044ff });

        // Body
        const bodyLen = 4, bodyRad = 1;
        const body = new THREE.Mesh(new THREE.CylinderGeometry(bodyRad, bodyRad, bodyLen, 16), hullMat);
        body.rotation.x = Math.PI / 2;
        spacecraft.add(body);

        const nose = new THREE.Mesh(new THREE.SphereGeometry(bodyRad, 16, 16), hullMat);
        nose.position.z = bodyLen / 2;
        spacecraft.add(nose);

        const rear = new THREE.Mesh(new THREE.SphereGeometry(bodyRad, 16, 16), hullMat);
        rear.position.z = -bodyLen / 2;
        spacecraft.add(rear);

        // Cockpit
        const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 8, 0, Math.PI*2, 0, Math.PI/2), windowMat);
        cockpit.position.set(0, 0.65, 1.1);
        cockpit.rotation.x = -0.3;
        cockpit.scale.set(1.2, 0.6, 1.0);
        spacecraft.add(cockpit);

        const cockpitRing = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.06, 8, 24), darkMat);
        cockpitRing.position.set(0, 0.65, 1.05);
        cockpitRing.rotation.x = Math.PI / 2;
        cockpitRing.rotation.z = 0.3;
        cockpitRing.scale.set(1.2, 1.2, 0.8);
        spacecraft.add(cockpitRing);

        // Wings
        const leftWing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, 1.2), hullMat);
        leftWing.position.set(-1.5, 0.1, -0.2);
        leftWing.rotation.z = 0.1;
        spacecraft.add(leftWing);

        const rightWing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, 1.2), hullMat);
        rightWing.position.set(1.5, 0.1, -0.2);
        rightWing.rotation.z = -0.1;
        spacecraft.add(rightWing);

        const leftTip = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.8), accentMat);
        leftTip.position.set(-2.4, 0.15, -0.2);
        spacecraft.add(leftTip);

        const rightTip = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.8), accentMat);
        rightTip.position.set(2.4, 0.15, -0.2);
        spacecraft.add(rightTip);

        // Fins
        const leftFin = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.0, 1.4), darkMat);
        leftFin.position.set(-0.8, 0.9, -1.4);
        leftFin.rotation.x = -0.2;
        leftFin.rotation.z = 0.3;
        spacecraft.add(leftFin);

        const rightFin = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.0, 1.4), darkMat);
        rightFin.position.set(0.8, 0.9, -1.4);
        rightFin.rotation.x = -0.2;
        rightFin.rotation.z = -0.3;
        spacecraft.add(rightFin);

        const centerFin = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 1.0), darkMat);
        centerFin.position.set(0, 1.0, -1.6);
        spacecraft.add(centerFin);

        // Engine
        const engineHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.8, 0.8, 8), darkMat);
        engineHousing.rotation.x = Math.PI / 2;
        engineHousing.position.z = -2.3;
        spacecraft.add(engineHousing);

        const nozzlePositions = [[-0.5, 0, -2.8], [0.5, 0, -2.8], [0, 0, -2.9]];
        const engineGlows = [];
        nozzlePositions.forEach(pos => {
            const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 0.6, 8), darkMat);
            nozzle.rotation.x = Math.PI / 2;
            nozzle.position.set(pos[0], pos[1], pos[2]);
            spacecraft.add(nozzle);

            const glow = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8), glowMat);
            glow.position.set(pos[0], pos[1], pos[2] - 0.35);
            spacecraft.add(glow);
            engineGlows.push(glow);
        });

        // Antenna
        const antennaBase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.2, 6), darkMat);
        antennaBase.position.set(0, 0.95, 1.5);
        spacecraft.add(antennaBase);

        const antennaRod = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.2, 6), hullMat);
        antennaRod.position.set(0, 1.6, 1.5);
        spacecraft.add(antennaRod);

        const antennaBall = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6), accentMat);
        antennaBall.position.set(0, 2.2, 1.5);
        spacecraft.add(antennaBall);

        // Engine point light
        const engineLight = new THREE.PointLight(0x2266ff, 2, 15);
        engineLight.position.set(0, 0, -3.2);
        spacecraft.add(engineLight);

        spacecraft.position.set(0, 0, 2);
        scene.add(spacecraft);

        // =====================
        // ASTEROIDS
        // =====================
        const asteroids = [];
        const asteroidMaterials = [
            new THREE.MeshStandardMaterial({ color: 0x886655, roughness: 0.9, metalness: 0.1 }),
            new THREE.MeshStandardMaterial({ color: 0x665544, roughness: 0.9, metalness: 0.1 }),
            new THREE.MeshStandardMaterial({ color: 0x776655, roughness: 0.85, metalness: 0.2 })
        ];

        function createAsteroid() {
            const size = 0.5 + Math.random() * 1.5;
            const geo = new THREE.IcosahedronGeometry(size, 0);
            
            // Randomly deform vertices for irregular shape
            const positions = geo.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                positions.setXYZ(i,
                    positions.getX(i) * (0.8 + Math.random() * 0.4),
                    positions.getY(i) * (0.8 + Math.random() * 0.4),
                    positions.getZ(i) * (0.8 + Math.random() * 0.4)
                );
            }
            geo.computeVertexNormals();

            const mat = asteroidMaterials[Math.floor(Math.random() * asteroidMaterials.length)];
            const mesh = new THREE.Mesh(geo, mat);
            
            mesh.position.set(
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 15,
                -50 - Math.random() * 30
            );
            
            mesh.userData = {
                speed: 0.3 + Math.random() * 0.5,
                rotationSpeed: {
                    x: (Math.random() - 0.5) * 0.03,
                    y: (Math.random() - 0.5) * 0.03,
                    z: (Math.random() - 0.5) * 0.03
                },
                size: size
            };
            
            scene.add(mesh);
            asteroids.push(mesh);
        }

        // =====================
        // GAME STATE
        // =====================
        const gameState = {
            running: false,
            score: 0,
            speed: 1.0,
            shield: 100,
            boosting: false,
            keys: {},
            cameraShake: 0,
            baseSpeed: 0.4,
            spawnTimer: 0,
            spawnInterval: 1.2
        };

        // =====================
        // CONTROLS
        // =====================
        document.addEventListener('keydown', (e) => {
            gameState.keys[e.code] = true;
            if (e.code === 'Space') e.preventDefault();
        });
        document.addEventListener('keyup', (e) => {
            gameState.keys[e.code] = false;
        });

        // =====================
        // UI ELEMENTS
        // =====================
        const scoreEl = document.getElementById('score');
        const speedEl = document.getElementById('speed');
        const shieldEl = document.getElementById('shield');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // =====================
        // START / RESTART
        // =====================
        function startGame() {
            // Reset state
            gameState.running = true;
            gameState.score = 0;
            gameState.speed = 1.0;
            gameState.shield = 100;
            gameState.spawnTimer = 0;
            gameState.cameraShake = 0;
            
            // Reset spacecraft
            spacecraft.position.set(0, 0, 2);
            spacecraft.rotation.set(0, 0, 0);
            
            // Clear asteroids
            asteroids.forEach(a => scene.remove(a));
            asteroids.length = 0;
            
            // Hide screens
            startScreen.style.display = 'none';
            gameOverEl.style.display = 'none';
            
            updateHUD();
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // =====================
        // HUD UPDATE
        // =====================
        function updateHUD() {
            scoreEl.textContent = Math.floor(gameState.score);
            speedEl.textContent = gameState.speed.toFixed(1) + 'x';
            
            const shieldPercent = Math.max(0, Math.round(gameState.shield));
            if (shieldPercent > 60) {
                shieldEl.textContent = '🟢 ' + shieldPercent + '%';
                shieldEl.style.color = '#44ff88';
            } else if (shieldPercent > 30) {
                shieldEl.textContent = '🟡 ' + shieldPercent + '%';
                shieldEl.style.color = '#ffcc00';
            } else {
                shieldEl.textContent = '🔴 ' + shieldPercent + '%';
                shieldEl.style.color = '#ff4466';
            }
        }

        // =====================
        // GAME OVER
        // =====================
        function gameOver() {
            gameState.running = false;
            finalScoreEl.textContent = Math.floor(gameState.score);
            gameOverEl.style.display = 'block';
        }

        // =====================
        // ANIMATION LOOP
        // =====================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = performance.now() * 0.001;

            if (gameState.running) {
                // ============ MOVEMENT ============
                const moveSpeed = 12 * delta;
                const keys = gameState.keys;
                
                // Horizontal movement
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    spacecraft.position.x -= moveSpeed;
                    spacecraft.rotation.z = THREE.MathUtils.lerp(spacecraft.rotation.z, 0.4, 0.1);
                } else if (keys['ArrowRight'] || keys['KeyD']) {
                    spacecraft.position.x += moveSpeed;
                    spacecraft.rotation.z = THREE.MathUtils.lerp(spacecraft.rotation.z, -0.4, 0.1);
                } else {
                    spacecraft.rotation.z = THREE.MathUtils.lerp(spacecraft.rotation.z, 0, 0.1);
                }
                
                // Vertical movement
                if (keys['ArrowUp'] || keys['KeyW']) {
                    spacecraft.position.y += moveSpeed * 0.7;
                } else if (keys['ArrowDown'] || keys['KeyS']) {
                    spacecraft.position.y -= moveSpeed * 0.7;
                }
                
                // Boundary clamp
                spacecraft.position.x = THREE.MathUtils.clamp(spacecraft.position.x, -8, 8);
                spacecraft.position.y = THREE.MathUtils.clamp(spacecraft.position.y, -6, 6);
                
                // Boost
                gameState.boosting = keys['Space'];
                const targetSpeed = gameState.boosting ? 2.5 : 1.0;
                gameState.speed = THREE.MathUtils.lerp(gameState.speed, targetSpeed, 0.05);
                
                // Score increase
                gameState.score += delta * 20 * gameState.speed;
                
                // Camera shake when boosting
                if (gameState.boosting) {
                    gameState.cameraShake = 0.05;
                    // Boost particles (reuse glow)
                    engineGlows.forEach(g => {
                        g.scale.setScalar(1 + Math.random() * 1.5);
                        g.material.emissiveIntensity = 1.5 + Math.random();
                    });
                } else {
                    engineGlows.forEach(g => {
                        g.scale.setScalar(1 + Math.sin(time * 10) * 0.2);
                        g.material.emissiveIntensity = 1;
                    });
                }
                
                // Camera follow (with shake)
                const shakeX = (Math.random() - 0.5) * gameState.cameraShake;
                const shakeY = (Math.random() - 0.5) * gameState.cameraShake;
                gameState.cameraShake *= 0.9;
                
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, spacecraft.position.x * 0.5, 0.05) + shakeX;
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, 3 + spacecraft.position.y * 0.3, 0.05) + shakeY;
                camera.lookAt(spacecraft.position.x * 0.3, spacecraft.position.y * 0.2, -8);
                
                // ============ SPAWN ASTEROIDS ============
                gameState.spawnTimer += delta;
                if (gameState.spawnTimer > gameState.spawnInterval) {
                    gameState.spawnTimer = 0;
                    createAsteroid();
                    // Increase difficulty
                    gameState.spawnInterval = Math.max(0.4, gameState.spawnInterval - 0.01);
                }
                
                // ============ UPDATE ASTEROIDS ============
                for (let i = asteroids.length - 1; i >= 0; i--) {
                    const asteroid = asteroids[i];
                    
                    // Move toward player (positive Z)
                    asteroid.position.z += (asteroid.userData.speed + gameState.baseSpeed) * gameState.speed * delta * 15;
                    
                    // Rotate
                    asteroid.rotation.x += asteroid.userData.rotationSpeed.x;
                    asteroid.rotation.y += asteroid.userData.rotationSpeed.y;
                    asteroid.rotation.z += asteroid.userData.rotationSpeed.z;
                    
                    // Remove if passed behind camera
                    if (asteroid.position.z > 15) {
                        scene.remove(asteroid);
                        asteroids.splice(i, 1);
                        continue;
                    }
                    
                    // ============ COLLISION DETECTION ============
                    const dx = asteroid.position.x - spacecraft.position.x;
                    const dy = asteroid.position.y - spacecraft.position.y;
                    const dz = asteroid.position.z - spacecraft.position.z;
                    const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    
                    const collisionRadius = asteroid.userData.size + 1.2;
                    
                    if (distance < collisionRadius) {
                        // Hit!
                        const damage = asteroid.userData.size * 25;
                        gameState.shield -= damage;
                        gameState.cameraShake = 0.5;
                        
                        // Remove asteroid
                        scene.remove(asteroid);
                        asteroids.splice(i, 1);
                        
                        // Flash effect
                        spacecraft.children.forEach(child => {
                            if (child.material && child.material.emissive) {
                                child.material.emissive.setHex(0xff0000);
                                setTimeout(() => {
                                    if (child.material) child.material.emissive.setHex(0x000000);
                                }, 150);
                            }
                        });
                        
                        if (gameState.shield <= 0) {
                            gameState.shield = 0;
                            updateHUD();
                            gameOver();
                            return;
                        }
                    }
                }
                
                // Move stars to simulate motion
                stars.position.z += gameState.speed * delta * 3;
                if (stars.position.z > 50) stars.position.z = 0;
                
                updateHUD();
            }
            
            // Engine glow pulsation always
            engineLight.intensity = 1.5 + Math.sin(time * 8) * 0.8;
            
            // Rotate spacecraft slightly for idle bob
            if (!gameState.running) {
                spacecraft.rotation.y = Math.sin(time * 0.5) * 0.2;
                spacecraft.position.y = Math.sin(time) * 0.1;
            }
            
            renderer.render(scene, camera);
        }

        // =====================
        // RESIZE
        // =====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation loop
        animate();

        // Initial idle state - show spacecraft on start screen
        spacecraft.position.set(0, 0, 2);
        spacecraft.rotation.set(0, 0, 0);
        // Add a few asteroids for ambience even on start screen
        for (let i = 0; i < 3; i++) createAsteroid();

    </script>
</body>
</html>
