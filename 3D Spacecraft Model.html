<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spacecraft with Engine Fire - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; color: white; font-family: Arial, Helvetica, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
            user-select: none;
            font-size: 14px;
            border: 1px solid #ff6600;
            color: #ffaa66;
        }
    </style>
</head>
<body>
    <div id="info">🚀 Spacecraft with Engine Fire | Drag to rotate | Scroll to zoom</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        // --- Stars ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            const r = 400 + Math.random() * 100;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPositions[i] = Math.sin(phi) * Math.cos(theta) * r;
            starPositions[i+1] = Math.sin(phi) * Math.sin(theta) * r;
            starPositions[i+2] = Math.cos(phi) * r;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(
            starsGeometry,
            new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true })
        );
        scene.add(stars);

        // --- Camera ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(9, 5, 13);
        camera.lookAt(0, 0, 0);

        // --- Renderer ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.7;
        controls.target.set(0, 0.5, 0);
        controls.maxPolarAngle = Math.PI / 2;

        // --- Lighting ---
        scene.add(new THREE.AmbientLight(0x404060));

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4466cc, 0.5);
        fillLight.position.set(-10, 0, -10);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffaa66, 0.4);
        rimLight.position.set(-5, 5, -15);
        scene.add(rimLight);

        // Warm light from engine fire (dynamic flicker below)
        const engineLight = new THREE.PointLight(0xff5500, 3, 15);
        engineLight.position.set(0, 0.2, -4);
        scene.add(engineLight);

        // Cool blue fill light behind
        const engineBlueLight = new THREE.PointLight(0x2266ff, 1.5, 10);
        engineBlueLight.position.set(0, 0.2, -3.2);
        scene.add(engineBlueLight);

        // =============================================================
        // SPACECRAFT (same body as original model)
        // =============================================================
        const spacecraft = new THREE.Group();

        const hullMaterial = new THREE.MeshStandardMaterial({
            color: 0xb0c0d0, roughness: 0.4, metalness: 0.8, emissive: new THREE.Color(0x111122)
        });
        const darkMetalMaterial = new THREE.MeshStandardMaterial({
            color: 0x556677, roughness: 0.6, metalness: 0.9
        });
        const accentMaterial = new THREE.MeshStandardMaterial({
            color: 0xcc3333, roughness: 0.3, metalness: 0.7, emissive: new THREE.Color(0x330000)
        });
        const windowMaterial = new THREE.MeshStandardMaterial({
            color: 0x88ccff, emissive: new THREE.Color(0x004466), roughness: 0.1, metalness: 0.1,
            transparent: true, opacity: 0.9
        });
        const engineGlowMaterial = new THREE.MeshStandardMaterial({
            color: 0xff8844, emissive: new THREE.Color(0xff4411), roughness: 0.2, metalness: 0.1
        });

        // --- Main fuselage ---
        const bodyLength = 4.0;
        const bodyRadius = 1.0;

        const bodyCylinder = new THREE.Mesh(
            new THREE.CylinderGeometry(bodyRadius, bodyRadius, bodyLength, 16),
            hullMaterial
        );
        bodyCylinder.rotation.x = Math.PI / 2;
        bodyCylinder.castShadow = true;
        bodyCylinder.receiveShadow = true;
        spacecraft.add(bodyCylinder);

        const noseSphere = new THREE.Mesh(new THREE.SphereGeometry(bodyRadius, 16, 16), hullMaterial);
        noseSphere.position.z = bodyLength / 2;
        noseSphere.castShadow = true;
        spacecraft.add(noseSphere);

        const rearSphere = new THREE.Mesh(new THREE.SphereGeometry(bodyRadius, 16, 16), hullMaterial);
        rearSphere.position.z = -bodyLength / 2;
        rearSphere.castShadow = true;
        spacecraft.add(rearSphere);

        // --- Cockpit ---
        const cockpit = new THREE.Mesh(
            new THREE.SphereGeometry(0.55, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
            windowMaterial
        );
        cockpit.position.set(0, 0.65, 1.1);
        cockpit.rotation.x = -0.3;
        cockpit.scale.set(1.2, 0.6, 1.0);
        spacecraft.add(cockpit);

        const cockpitRing = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.06, 8, 24), darkMetalMaterial);
        cockpitRing.position.set(0, 0.65, 1.05);
        cockpitRing.rotation.x = Math.PI / 2;
        cockpitRing.rotation.z = 0.3;
        cockpitRing.scale.set(1.2, 1.2, 0.8);
        spacecraft.add(cockpitRing);

        // --- Wings ---
        const leftWing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, 1.2), hullMaterial);
        leftWing.position.set(-1.5, 0.1, -0.2);
        leftWing.rotation.z = 0.1;
        leftWing.rotation.y = 0.1;
        leftWing.castShadow = true;
        spacecraft.add(leftWing);

        const rightWing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, 1.2), hullMaterial);
        rightWing.position.set(1.5, 0.1, -0.2);
        rightWing.rotation.z = -0.1;
        rightWing.rotation.y = -0.1;
        rightWing.castShadow = true;
        spacecraft.add(rightWing);

        const leftTip = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.8), accentMaterial);
        leftTip.position.set(-2.4, 0.15, -0.2);
        leftTip.rotation.z = 0.1;
        spacecraft.add(leftTip);

        const rightTip = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.8), accentMaterial);
        rightTip.position.set(2.4, 0.15, -0.2);
        rightTip.rotation.z = -0.1;
        spacecraft.add(rightTip);

        // --- Tail fins ---
        const leftFin = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.0, 1.4), darkMetalMaterial);
        leftFin.position.set(-0.8, 0.9, -1.4);
        leftFin.rotation.x = -0.2;
        leftFin.rotation.z = 0.3;
        leftFin.castShadow = true;
        spacecraft.add(leftFin);

        const rightFin = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.0, 1.4), darkMetalMaterial);
        rightFin.position.set(0.8, 0.9, -1.4);
        rightFin.rotation.x = -0.2;
        rightFin.rotation.z = -0.3;
        rightFin.castShadow = true;
        spacecraft.add(rightFin);

        const centerFin = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 1.0), darkMetalMaterial);
        centerFin.position.set(0, 1.0, -1.6);
        centerFin.rotation.x = -0.1;
        centerFin.castShadow = true;
        spacecraft.add(centerFin);

        // --- Engine housing ---
        const engineHousing = new THREE.Mesh(
            new THREE.CylinderGeometry(0.9, 0.8, 0.8, 8),
            darkMetalMaterial
        );
        engineHousing.rotation.x = Math.PI / 2;
        engineHousing.position.z = -2.3;
        engineHousing.castShadow = true;
        spacecraft.add(engineHousing);

        // --- Engine nozzles + inner glow ---
        const nozzlePositions = [
            [-0.5, 0, -2.8],
            [0.5, 0, -2.8],
            [0, 0, -2.9]
        ];

        const nozzleGlows = [];
        nozzlePositions.forEach(pos => {
            const nozzle = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.35, 0.6, 8),
                darkMetalMaterial
            );
            nozzle.rotation.x = Math.PI / 2;
            nozzle.position.set(pos[0], pos[1], pos[2]);
            nozzle.castShadow = true;
            spacecraft.add(nozzle);

            // Inner hot glow (visible deep inside the nozzle)
            const glow = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8), engineGlowMaterial);
            glow.position.set(pos[0], pos[1], pos[2] - 0.15);
            spacecraft.add(glow);
            nozzleGlows.push(glow);
        });

        // --- Antenna ---
        const antennaBase = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.15, 0.2, 6), darkMetalMaterial
        );
        antennaBase.position.set(0, 0.95, 1.5);
        spacecraft.add(antennaBase);

        const antennaRod = new THREE.Mesh(
            new THREE.CylinderGeometry(0.03, 0.03, 1.2, 6), hullMaterial
        );
        antennaRod.position.set(0, 1.6, 1.5);
        spacecraft.add(antennaRod);

        const antennaBall = new THREE.Mesh(
            new THREE.SphereGeometry(0.1, 6), accentMaterial
        );
        antennaBall.position.set(0, 2.2, 1.5);
        spacecraft.add(antennaBall);

        // --- Side thrusters ---
        const thrusterGeo = new THREE.CylinderGeometry(0.2, 0.25, 0.5, 6);
        const leftThruster = new THREE.Mesh(thrusterGeo, darkMetalMaterial);
        leftThruster.position.set(-1.1, 0.1, -1.8);
        leftThruster.rotation.z = Math.PI / 2;
        leftThruster.rotation.x = 0.2;
        spacecraft.add(leftThruster);

        const rightThruster = new THREE.Mesh(thrusterGeo, darkMetalMaterial);
        rightThruster.position.set(1.1, 0.1, -1.8);
        rightThruster.rotation.z = -Math.PI / 2;
        rightThruster.rotation.x = 0.2;
        spacecraft.add(rightThruster);

        // --- Small greebles ---
        for (let i = 0; i < 8; i++) {
            const greeble = new THREE.Mesh(
                new THREE.BoxGeometry(0.15, 0.15, 0.15),
                i % 2 === 0 ? accentMaterial : darkMetalMaterial
            );
            greeble.position.set(
                (Math.random() - 0.5) * 1.8,
                (Math.random() - 0.5) * 1.0 + 0.3,
                (Math.random() - 0.5) * 3.0
            );
            greeble.rotation.set(Math.random(), Math.random(), Math.random());
            spacecraft.add(greeble);
        }

        spacecraft.position.y = 0.2;
        scene.add(spacecraft);

        // =============================================================
        // ENGINE FLAMES (multi-layer animated cones)
        // =============================================================
        const flames = [];

        function createFlame(pos) {
            const group = new THREE.Group();
            group.position.set(pos[0], pos[1], pos[2] - 0.4);

            // --- Outer flame (deep orange) ---
            const outerGeo = new THREE.ConeGeometry(0.35, 1.8, 10, 1, true);
            outerGeo.rotateX(-Math.PI / 2);
            outerGeo.translate(0, 0, -0.9);
            const outerMat = new THREE.MeshBasicMaterial({
                color: 0xff3300, transparent: true, opacity: 0.65,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            });
            const outer = new THREE.Mesh(outerGeo, outerMat);
            group.add(outer);

            // --- Middle flame (yellow-orange) ---
            const midGeo = new THREE.ConeGeometry(0.22, 1.2, 10, 1, true);
            midGeo.rotateX(-Math.PI / 2);
            midGeo.translate(0, 0, -0.6);
            const midMat = new THREE.MeshBasicMaterial({
                color: 0xffaa00, transparent: true, opacity: 0.8,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            });
            const mid = new THREE.Mesh(midGeo, midMat);
            group.add(mid);

            // --- Inner flame (white-yellow) ---
            const innerGeo = new THREE.ConeGeometry(0.12, 0.7, 10, 1, true);
            innerGeo.rotateX(-Math.PI / 2);
            innerGeo.translate(0, 0, -0.35);
            const innerMat = new THREE.MeshBasicMaterial({
                color: 0xffffaa, transparent: true, opacity: 1,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            });
            const inner = new THREE.Mesh(innerGeo, innerMat);
            group.add(inner);

            // --- Core (blue-white) ---
            const coreGeo = new THREE.ConeGeometry(0.06, 0.4, 8, 1, true);
            coreGeo.rotateX(-Math.PI / 2);
            coreGeo.translate(0, 0, -0.2);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0x88ddff, transparent: true, opacity: 1,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            group.add(core);

            spacecraft.add(group);
            flames.push({ group, outer, mid, inner, core });
        }

        nozzlePositions.forEach(createFlame);

        // =============================================================
        // EXHAUST PARTICLES (sparks + gas)
        // =============================================================
        const PARTICLE_COUNT = 220;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(PARTICLE_COUNT * 3);
        const particleCol = new Float32Array(PARTICLE_COUNT * 3);
        const particleVel = new Float32Array(PARTICLE_COUNT * 3);
        const particleBaseCol = new Float32Array(PARTICLE_COUNT * 3);
        const particleLife = new Float32Array(PARTICLE_COUNT);
        const particleMaxLife = new Float32Array(PARTICLE_COUNT);

        // Park all particles off-screen initially
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particlePos[i * 3 + 1] = -1000;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleCol, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 0.16,
            vertexColors: true,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        spacecraft.add(particleSystem);

        let spawnAccumulator = 0;
        const SPAWN_RATE = 140; // particles per second

        function spawnParticle() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (particleLife[i] > 0) continue;

                // Pick a random nozzle
                const n = nozzlePositions[Math.floor(Math.random() * nozzlePositions.length)];
                particlePos[i * 3]     = n[0] + (Math.random() - 0.5) * 0.25;
                particlePos[i * 3 + 1] = n[1] + (Math.random() - 0.5) * 0.25;
                particlePos[i * 3 + 2] = n[2] - 0.5;

                // Velocity: mostly backwards (-z), with spread
                particleVel[i * 3]     = (Math.random() - 0.5) * 0.9;
                particleVel[i * 3 + 1] = (Math.random() - 0.5) * 0.9;
                particleVel[i * 3 + 2] = -(2.5 + Math.random() * 4.5);

                // Random fire colors (orange → yellow → white-blue)
                const r = Math.random();
                let cr, cg, cb;
                if (r < 0.55) {
                    cr = 1.0; cg = 0.35 + Math.random() * 0.25; cb = 0.05;      // red-orange
                } else if (r < 0.85) {
                    cr = 1.0; cg = 0.85 + Math.random() * 0.15; cb = 0.25;      // yellow
                } else {
                    cr = 0.65; cg = 0.9; cb = 1.0;                              // blue-white
                }
                particleBaseCol[i * 3]     = cr;
                particleBaseCol[i * 3 + 1] = cg;
                particleBaseCol[i * 3 + 2] = cb;
                particleCol[i * 3]         = cr;
                particleCol[i * 3 + 1]     = cg;
                particleCol[i * 3 + 2]     = cb;

                const life = 0.55 + Math.random() * 0.85;
                particleLife[i] = life;
                particleMaxLife[i] = life;
                break;
            }
        }

        function updateParticles(delta) {
            // Spawn
            spawnAccumulator += delta * SPAWN_RATE;
            while (spawnAccumulator >= 1) {
                spawnParticle();
                spawnAccumulator -= 1;
            }

            // Update
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (particleLife[i] <= 0) continue;

                particleLife[i] -= delta;

                if (particleLife[i] <= 0) {
                    particlePos[i * 3 + 1] = -1000;
                    continue;
                }

                particlePos[i * 3]     += particleVel[i * 3] * delta;
                particlePos[i * 3 + 1] += particleVel[i * 3 + 1] * delta;
                particlePos[i * 3 + 2] += particleVel[i * 3 + 2] * delta;

                // Slight turbulence
                particleVel[i * 3]     += (Math.random() - 0.5) * 2.0 * delta;
                particleVel[i * 3 + 1] += (Math.random() - 0.5) * 2.0 * delta;

                // Fade by dimming vertex color
                const fade = Math.max(0, particleLife[i] / particleMaxLife[i]);
                particleCol[i * 3]     = particleBaseCol[i * 3]     * fade;
                particleCol[i * 3 + 1] = particleBaseCol[i * 3 + 1] * fade;
                particleCol[i * 3 + 2] = particleBaseCol[i * 3 + 2] * fade;
            }

            particleGeo.attributes.position.needsUpdate = true;
            particleGeo.attributes.color.needsUpdate = true;
        }

        // =============================================================
        // ANIMATION LOOP
        // =============================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05);
            const t = performance.now() * 0.001;

            controls.update();

            // --- Flame flicker & length animation ---
            flames.forEach((f, idx) => {
                const seed = idx * 1.7;
                const flicker =
                    0.85 +
                    Math.sin(t * 24 + seed) * 0.10 +
                    Math.sin(t * 37 + seed * 2.3) * 0.07 +
                    (Math.random() - 0.5) * 0.06;

                // Stretch flames along their length (z)
                f.outer.scale.set(1 + (flicker - 1) * 0.5, 1 + (flicker - 1) * 0.5, flicker * 1.15);
                f.mid.scale.set(1, 1, flicker * 1.05);
                f.inner.scale.set(1, 1, flicker * 0.95);
                f.core.scale.set(1, 1, flicker * 0.85);

                // Opacity pulse
                f.outer.material.opacity = 0.5 + Math.sin(t * 28 + seed) * 0.2 + 0.15;
                f.mid.material.opacity   = 0.7 + Math.sin(t * 33 + seed) * 0.15;
            });

            // --- Nozzle inner glow pulse ---
            nozzleGlows.forEach((g, idx) => {
                const s = 1 + Math.sin(t * 20 + idx) * 0.15;
                g.scale.setScalar(s);
            });

            // --- Exhaust particles ---
            updateParticles(delta);

            // --- Flickering engine lights ---
            engineLight.intensity = 2.5 + Math.sin(t * 22) * 1.2 + Math.random() * 0.6;
            engineBlueLight.intensity = 1.2 + Math.sin(t * 30) * 0.6;

            // --- Star drift ---
            stars.rotation.y += 0.0001;

            // --- Gentle bobbing ---
            spacecraft.position.y = 0.2 + Math.sin(t * 2) * 0.03;

            renderer.render(scene, camera);
        }

        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
