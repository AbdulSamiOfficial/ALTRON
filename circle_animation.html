<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digital Current Field</title>
<style>
  :root{
    --btc:      #f7931a;
    --btc-2:    #ffc46b;
    --btc-3:    #ffe6b8;
  }

  *{ box-sizing: border-box; }

  html, body{ height: 100%; }

  body{
    margin: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #101a26 0%, #080b12 45%, #030408 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* ── faint digital grid in the background ───────────────────── */
  body::before{
    content: "";
    position: fixed;
    inset: -2px;
    background-image:
      linear-gradient(rgba(120,190,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,190,255,.05) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 70%);
            mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── stage ──────────────────────────────────────────────────── */
  .stage{
    position: relative;
    width: min(92vmin, 640px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }

  .field{
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* helper: absolutely centered, self-rounding layer */
  .layer{
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 50%;
  }

  /* ── central glow ───────────────────────────────────────────── */
  .glow{
    width: 62%;
    height: 62%;
    background: radial-gradient(circle,
      rgba(247,147,26,.50) 0%,
      rgba(247,147,26,.18) 40%,
      transparent 68%);
    filter: blur(14px);
    animation: breathe 4.5s ease-in-out infinite;
  }

  /* ── radial "current" spokes ────────────────────────────────── */
  .spokes{
    width: 100%;
    height: 100%;
    background: repeating-conic-gradient(from 0deg,
      rgba(247,147,26,.35) 0deg .5deg,
      transparent .5deg 15deg);
    -webkit-mask: radial-gradient(circle closest-side, transparent 0 40%, #000 62%, transparent 94%);
            mask: radial-gradient(circle closest-side, transparent 0 40%, #000 62%, transparent 94%);
    opacity: .6;
    animation: spin 70s linear infinite;
  }

  /* ── dashed inner ring ──────────────────────────────────────── */
  .ring-dash{
    width: 47%;
    height: 47%;
    border: 1.5px dashed rgba(247,147,26,.6);
    box-shadow: 0 0 26px rgba(247,147,26,.20);
    animation: spin 22s linear infinite;
  }

  /* ── expanding energy pulses ────────────────────────────────── */
  .pulse{
    width: 38%;
    height: 38%;
    border: 1px solid rgba(247,147,26,.75);
    box-shadow:
      0 0 20px rgba(247,147,26,.35),
      inset 0 0 20px rgba(247,147,26,.20);
    animation: pulse 3.6s cubic-bezier(.22,.7,.35,1) infinite;
  }
  .pulse.p2{ animation-delay: 1.2s; }
  .pulse.p3{ animation-delay: 2.4s; }

  /* ── keyframes ──────────────────────────────────────────────── */
  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  @keyframes pulse{
    0%   { transform: scale(.55); opacity: 0; }
    12%  { opacity: .9; }
    100% { transform: scale(2.3); opacity: 0; }
  }

  @keyframes breathe{
    0%, 100%{ opacity: .75; transform: scale(1); }
    50%     { opacity: 1;   transform: scale(1.12); }
  }
</style>
</head>
<body>

  <div class="stage">

    <!-- ══ digital current field ══ -->
    <div class="field">
      <div class="layer glow"></div>
      <div class="layer spokes"></div>
      <div class="layer ring-dash"></div>

      <div class="layer pulse p1"></div>
      <div class="layer pulse p2"></div>
      <div class="layer pulse p3"></div>
    </div>

  </div>

</body>
</html>
